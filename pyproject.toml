[project]
name = "simbert"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic~=2.14.3",
  "pydantic-settings",
  "httpx",
  "feedparser",
  "beautifulsoup4",
  "langgraph~=1.2.20",
  "langgraph-checkpoint-sqlite~=3.1.3",
  "mcp~=2.3.0",
  "openai~=3.49.0",
  "langsmith~=0.14.17",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simbert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]